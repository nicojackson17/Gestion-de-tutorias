<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historial de Tutorías</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <!-- BARRA LATERAL -->

    <aside class="sidebar">
        <a href="inicio.html"
           class="sidebar-icon"
           title="Inicio">

            <i class="fa-solid fa-house"></i>
        </a>


        <a href="index.html"
           class="sidebar-icon biblioteca-icon"
           title="Biblioteca">

            <i class="fa-solid fa-bars"></i>
        </a>


        <a href="perfil.html"
           class="sidebar-icon perfil-icon"
           title="Perfil">

            <i class="fa-solid fa-user"></i>
        </a>
    </aside>



    <!-- CONTENIDO PRINCIPAL -->

    <main class="main-content">


        <div class="historial-contenedor">


            <!-- TÍTULO -->

            <h1 class="historial-titulo">

                Historial

            </h1>



            <!-- SELECTOR DE MES -->

            <div class="selector-mes">


                <button
                    id="mes-anterior"
                    class="boton-mes">

                    <i class="fa-solid fa-chevron-left"></i>

                </button>


                <h2 id="mes-actual">

                    Agosto 2026

                </h2>


                <button
                    id="mes-siguiente"
                    class="boton-mes">

                    <i class="fa-solid fa-chevron-right"></i>

                </button>


            </div>



            <!-- TABLA -->

            <div class="tabla-contenedor">

                <table class="tabla-historial">


                    <thead>

                        <tr>

                            <th>
                                Fecha
                            </th>

                            <th>
                                Motivo
                            </th>

                            <th>
                                Estudiantes
                            </th>

                            <th>
                                Estadísticas
                            </th>

                        </tr>

                    </thead>


                    <tbody id="historial-body">

                        <!-- JavaScript colocará
                             las tutorías aquí -->

                    </tbody>


                </table>

            </div>


            <!-- MENSAJE CUANDO NO HAY TUTORÍAS -->

            <p
                id="sin-registros"
                class="sin-registros">

                No hay tutorías registradas este mes.

            </p>


        </div>


    </main>



    <script src="historial.js"></script>

</body>

</html>
